name: Tests

on: ['push', 'pull_request']

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Prepare Laravel Application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Start Playwright
        run: |
          docker run -d --init \
            --name playwright \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:3000:3000 \
            mcr.microsoft.com/playwright:v1.65.0-noble \
            npx -y playwright@1.65.0 run-server \
              --port 3000 --host 0.0.0.0 --mode launchServer

          for attempt in {1..60}; do
            if docker logs playwright 2>&1 | grep -q 'Listening on'; then
              exit 0
            fi
            sleep 1
          done

          docker logs playwright
          exit 1

      - name: Tests
        run: ./vendor/bin/pest --ci --ws ws://127.0.0.1:3000 --host host.docker.internal --server-host 0.0.0.0
